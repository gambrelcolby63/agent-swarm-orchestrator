services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      SWARM_LLM: mock
      SWARM_GIMBAL_BACKEND: short
      SWARM_UART_MODE: sim
      SWARM_EMBEDDED_WORKERS: "0"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "swarm_orchestrator.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      SWARM_LLM: mock
      SWARM_GIMBAL_BACKEND: short
      SWARM_UART_MODE: sim
    depends_on:
      redis:
        condition: service_healthy
