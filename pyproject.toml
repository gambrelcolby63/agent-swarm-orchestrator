[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-orchestrator"
version = "0.1.0"
description = "Asynchronous multi-agent swarm orchestrator with a pan/tilt simulation and test demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "redis>=5.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "fakeredis>=2.26",
    "pytest-timeout>=2.3",
]

[project.scripts]
swarm-api = "swarm_orchestrator.api:main"
swarm-worker = "swarm_orchestrator.worker:main"
swarm-demo = "swarm_orchestrator.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
swarm_orchestrator = ["static/*"]
