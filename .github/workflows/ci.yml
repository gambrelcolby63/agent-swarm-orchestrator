name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q --timeout=60
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
      - name: Lightweight pan/tilt demo
        run: python scripts/demo_run.py --output /tmp/swarm-demo
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
